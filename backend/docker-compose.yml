services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dispatchly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/dispatchly
      JWT_SECRET: dispatchly-local-development-secret-change-in-production
      PORT: 3000
    ports:
      - "8000:3000"

volumes:
  postgres_data:
